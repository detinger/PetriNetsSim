<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petri Nets Simulator</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%231f5f8b'/%3E%3Cg fill='none' stroke='white' stroke-width='2'%3E%3Ccircle cx='8.5' cy='15' r='3.5'/%3E%3Ccircle cx='21.5' cy='15' r='3.5'/%3E%3Cpath d='M12 15h1.5M16.5 15H18'/%3E%3C/g%3E%3Crect x='14' y='9' width='2' height='12' fill='white'/%3E%3C/svg%3E" />
  <script>
    // Apply the stored theme before first paint to avoid a light/dark flash
    (function () {
      try {
        var stored = localStorage.getItem('petrinets-theme');
        var dark = stored === 'dark' ||
          ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
